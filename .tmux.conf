# optional - term
set-option -ga terminal-overrides ',xterm*:smcup@:rmcup@'
set-option -sa terminal-overrides ',xterm*:Ss=\E[%p1%d q:Se='
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -sa terminal-features "xterm-256color:RGB"

# options - leader key
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# options - general
set-option -g mouse on
set-option -g repeat-time 1250
set-option -g history-limit 20000
set-option -g detach-on-destroy off
set-option -s escape-time 0
set-option -s focus-events on
set-option -s set-clipboard on
set-hook -g session-closed "choose-tree -s"

# options - 1‑base indexing
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# tpm bootstrap
if-shell "[ ! -d ~/.tmux/plugins/tpm ]" \
  "run-shell \"git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm\"" \
  ""

# tpm plugin list
set-option -g @plugin "tmux-plugins/tpm"
set-option -g @plugin "tmux-plugins/tmux-sensible"
set-option -g @plugin "catppuccin/tmux"
set-option -g @plugin "christoomey/vim-tmux-navigator"

# catppuccin theme
set-option -g @catppuccin_flavor "mocha"
set-option -g @catppuccin_status_background "default"
# the session module is used as org-repo context, not the literal session
# name: worktree sessions (#S carries a -branch suffix) derive org-repo from
# session_path; the branch is shown by the separate worktree module below
set-option -g @catppuccin_session_text "#{?#{m:*/.worktrees/*,#{session_path}}, #{s|^.*/([^/]+)/([^/]+)/\\.worktrees/.*$|\\1-\\2|:session_path}, #S}"
set-option -g @catppuccin_window_current_text " #W#{E:@oc_mark}"
set-option -g @catppuccin_window_text " #[fg=#{@thm_overlay_1}]#W#{E:@oc_mark}"
# prefix indicator: swap the current window number for a glyph while the
# leader (C-Space) is armed
set-option -g @catppuccin_window_current_number "#{?client_prefix,󰘳,#I}"
set-option -g @catppuccin_window_flags "icon"
set-option -g @catppuccin_window_status_style "basic"

# opencode attention markers - state is written by .local/bin/oc-notify, driven by
# .config/opencode/plugin/tmux-notify.ts. @oc_win is window scoped, @oc_state is pane
# scoped, and @oc_alert is a pre-rendered global badge. @oc_alert is first in status-right,
# which is right-aligned, so it grows leftward and never displaces the widgets after it.
set-option -g @oc_mark "#{?#{==:#{@oc_win},waiting},#[fg=#{@thm_red}] ◆#[fg=#{@thm_fg}],#{?#{==:#{@oc_win},error},#[fg=#{@thm_peach}] ▲#[fg=#{@thm_fg}],#{?#{==:#{@oc_win},done},#[fg=#{@thm_yellow}] ●#[fg=#{@thm_fg}],}}}"
set-hook -g pane-focus-in "run-shell -b '~/.dotfiles/.local/bin/oc-notify clear #{pane_id}'"
set-hook -g pane-exited "run-shell -b '~/.dotfiles/.local/bin/oc-notify refresh'"

# status bar
set-option -g status-right-length 100
set-option -g status-left-length 100
set-option -g status-left ""
set-option -g status-interval 1
set-option -g status-right ""
set-option -ag status-right "#{E:@oc_alert}"
# worktree branch pill: only rendered for worktree sessions
set-option -ag status-right "#{?#{m:*/.worktrees/*,#{session_path}},#{E:@catppuccin_status_worktree},}"
set-option -ag status-right "#{E:@catppuccin_status_session}"
set-option -ag status-right "#{E:@catppuccin_status_date_time}"

# caps lock indicator: rendered centered in the status line (independent of
# the left-aligned window list and right-aligned widgets). appended to the
# default status-format only if not already present, so reloads stay
# idempotent (a bare append would duplicate the segment on every reload)
if-shell "! tmux show-options -gv 'status-format[0]' | grep -q capslock-status" \
  "set-option -ag status-format[0] '#[align=centre]#(~/.dotfiles/.local/bin/capslock-status)'"

# bindings - scripts
bind-key r source-file ~/.tmux.conf
bind-key a run-shell "~/.dotfiles/.local/bin/oc-notify jump"
bind-key f run-shell ~/.dotfiles/.local/bin/tmux-sessionizer
bind-key g display-popup -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" lazygit

# bindings - nav
unbind-key n
unbind-key p
bind-key -r n next-window
bind-key -r p previous-window
bind-key \- split-window -v -c "#{pane_current_path}"
bind-key \\ split-window -h -c "#{pane_current_path}"

# initialize tpm
run-shell "~/.tmux/plugins/tpm/tpm"

# custom worktree status module: must load after tpm so the catppuccin theme
# variables and module machinery exist
source-file ~/.config/tmux/worktree-module.conf
