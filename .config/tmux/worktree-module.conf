# vim:set ft=tmux:
# custom catppuccin status module: current worktree branch name.
# composed with the plugin's own module machinery, so it inherits pill
# styling. only rendered for worktree sessions (see .tmux.conf status-right).
%hidden MODULE_NAME="worktree"

set -gq "@catppuccin_worktree_icon" "󰙅 "
set -gq "@catppuccin_worktree_color" "#{E:@thm_mauve}"
set -gq "@catppuccin_worktree_text" " #{b:session_path}"

source -F "~/.tmux/plugins/tmux/utils/status_module.conf"
